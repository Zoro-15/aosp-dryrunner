name: "Nokia 6.1 (PL2) — LineageOS 23.2 Dry-Runner"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Execution Mode / Target"
        required: true
        type: choice
        options:
          - all-matrix
          - all-sequential
          - nothing
          - selinux_policy
          - bootimage
          - vendorimage
          - bacon
        default: all-matrix
      clean:
        description: "Clean Build (make clean before compilation)"
        type: boolean
        required: false
        default: false

concurrency:
  group: pl2-dryrunner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. PARALLEL MATRIX MODE (all-matrix): Spins up 4 parallel jobs simultaneously
  # --------------------------------------------------------------------------
  parallel-error-probe:
    if: github.event.inputs.target == 'all-matrix'
    name: "Matrix: ${{ matrix.probe_target }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        probe_target:
          - nothing
          - selinux_policy
          - bootimage
          - vendorimage

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Maximize Runner Disk Space"
        run: |
          echo "--> Freeing runner disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: "Install System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git git-lfs ccache zstd curl rsync zip unzip \
            build-essential python-is-python3 python3-pip \
            libssl-dev libncursesw5-dev bc bison flex libxml2-utils \
            schedtool pkg-config libarchive-tools
          
          # Install Google repo tool
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: "Configure Git Identity"
        run: |
          git config --global user.name "Zoro-15"
          git config --global user.email "bot@github.com"
          git config --global color.ui false

      - name: "Execute Probe Target: ${{ matrix.probe_target }}"
        run: |
          chmod +x build.sh
          ./build.sh "${{ matrix.probe_target }}" "${{ github.event.inputs.clean || 'false' }}"

      - name: "Upload Build Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "logs-${{ matrix.probe_target }}"
          path: |
            build_a16_PL2.log
            out/error.log
          retention-days: 7

      - name: "Upload Kernel Boot Image"
        if: success() && matrix.probe_target == 'bootimage'
        uses: actions/upload-artifact@v4
        with:
          name: "PL2-boot-image"
          path: out/target/product/PL2/boot.img
          retention-days: 14

      - name: "Upload Vendor Image"
        if: success() && matrix.probe_target == 'vendorimage'
        uses: actions/upload-artifact@v4
        with:
          name: "PL2-vendor-image"
          path: out/target/product/PL2/vendor.img
          retention-days: 14

  # --------------------------------------------------------------------------
  # 2. SINGLE / SEQUENTIAL MODE (nothing / bootimage / vendorimage / all-sequential / bacon)
  # --------------------------------------------------------------------------
  single-or-sequential-probe:
    if: github.event.inputs.target != 'all-matrix'
    name: "Run Target: ${{ github.event.inputs.target }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Maximize Runner Disk Space"
        run: |
          echo "--> Freeing runner disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: "Install System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git git-lfs ccache zstd curl rsync zip unzip \
            build-essential python-is-python3 python3-pip \
            libssl-dev libncursesw5-dev bc bison flex libxml2-utils \
            schedtool pkg-config libarchive-tools
          
          # Install Google repo tool
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: "Configure Git Identity"
        run: |
          git config --global user.name "Zoro-15"
          git config --global user.email "bot@github.com"
          git config --global color.ui false

      - name: "Execute Target: ${{ github.event.inputs.target }}"
        run: |
          chmod +x build.sh
          ./build.sh "${{ github.event.inputs.target }}" "${{ github.event.inputs.clean || 'false' }}"

      - name: "Upload Build Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "logs-${{ github.event.inputs.target }}"
          path: |
            build_a16_PL2.log
            out/error.log
          retention-days: 7

      - name: "Upload Boot Image"
        if: success() && (github.event.inputs.target == 'bootimage' || github.event.inputs.target == 'all-sequential' || github.event.inputs.target == 'bacon')
        uses: actions/upload-artifact@v4
        with:
          name: "PL2-boot-image"
          path: out/target/product/PL2/boot.img
          retention-days: 14

      - name: "Upload Vendor Image"
        if: success() && (github.event.inputs.target == 'vendorimage' || github.event.inputs.target == 'all-sequential' || github.event.inputs.target == 'bacon')
        uses: actions/upload-artifact@v4
        with:
          name: "PL2-vendor-image"
          path: out/target/product/PL2/vendor.img
          retention-days: 14

      - name: "Upload ROM Package"
        if: success() && github.event.inputs.target == 'bacon'
        uses: actions/upload-artifact@v4
        with:
          name: "PL2-LineageOS-23.2-Package"
          path: out/target/product/PL2/lineage-23.2-*-UNOFFICIAL-PL2.zip
          retention-days: 14
